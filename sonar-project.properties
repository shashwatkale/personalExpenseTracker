sonar.projectKey=shashwatkale_personalExpenseTracker
sonar.organization=shashwatkale

# Relative paths to source directories
sonar.sources=backend/src,frontend/app,frontend/components,frontend/lib,ai-service/app

# Exclude test files and dependencies
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/*.test.ts,**/*.test.tsx

# Language specific settings
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.cs.opencover.reportsPaths=backend/coverage/coverage.opencover.xml
sonar.python.coverage.reportPaths=ai-service/coverage.xml
